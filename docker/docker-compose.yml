services:
  db:
    image: postgres:18-alpine
    environment:
      - POSTGRES_DB=odoo
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_USER=odoo
    volumes:
      # postgres:18+ requires the volume mounted at /var/lib/postgresql
      # (not /var/lib/postgresql/data) so the image can place data in
      # major-version-specific subdirectories for pg_upgrade.
      # See https://github.com/docker-library/postgres/pull/1259
      - odoo-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 5s
      timeout: 5s
      retries: 5

  odoo:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - .env.test
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Mount the repo so job_worker/ is importable as an addon
      - ..:/mnt/extra-addons/odoo-job-worker:ro,z
      - odoo-data:/var/lib/odoo
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
    command: odoo

volumes:
  odoo-db-data:
  odoo-data:
