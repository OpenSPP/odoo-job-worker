site_name: Odoo Job Worker
site_url: https://openspp.github.io/odoo-job-worker
site_description: High-performance, SQL-driven background job engine for Odoo
repo_url: https://github.com/OpenSPP/odoo-job-worker
repo_name: OpenSPP/odoo-job-worker

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - assets/css/extra.css

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - User Guide:
      - Enqueueing Jobs: usage.md
      - Job Graphs: job-graphs.md
      - Configuration: configuration.md
  - Operations:
      - Deployment: deployment.md
      - Monitoring: monitoring.md
  - Reference:
      - API Reference: reference.md
      - Best Practices: best-practices.md
      - Migration Guide: migration.md
  - Contributing: contributing.md
